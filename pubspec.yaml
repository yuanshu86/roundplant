name: circle_plant
description: 圆形植物 - 植物养护App v1
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # 状态管理
  provider: ^6.1.2
  # 分享 (调系统Share Sheet)
  # 锁定 7.x：12.x 的 Android Kotlin 源码在 AGP9+新Kotlin 工具链下编译不过(ShareSuccessManager 等未解析符号)
  share_plus: ^7.2.0
  # 分享时把带水印的 PNG 作为文件发出去（XFile）
  cross_file: ^0.3.4
  # 真存相册（保存图片按钮）：Android 11+ 免权限，iOS 走 PHPhotoLibrary
  image_gallery_saver_plus: ^5.1.1
  # 本地存储 (用户设置缓存)
  shared_preferences: ^2.2.2
  # 标题字体 ZCOOLKuaiLe（站酷快乐体）本地打包，已移除 google_fonts 运行时下载
  # 格式化日期
  intl: ^0.19.0
  # SQLite 本地数据库 (植物/浇水记录/日记/任务持久化)
  sqflite: ^2.3.3+1
  # 本地文件路径 (图片存储)
  path_provider: ^2.1.3
  # 相机/相册选图
  image_picker: ^1.1.1
  # 运行时权限请求（相机/相册），被永久拒绝时引导去系统设置开启
  permission_handler: ^11.3.1
  # UUID 生成 (植物/任务ID)
  uuid: ^4.4.0
  # 路径处理 (sqflite/path_provider 传递依赖，直接引用需显式声明)
  path: ^1.9.0
  # 本地通知（每日养护提醒，非侵入式，绝不做弹窗广告）
  flutter_local_notifications: ^17.2.0
  # 网络请求（调咱们自己的后端代理，APP 不持第三方 key）
  http: ^1.2.1
  http_parser: ^4.1.2
  # 定位（天气联动，后台不持续定位，仅启动时获取一次）
  geolocator: ^13.0.0
  # 后端即服务（P3 真实社交+云端同步：Auth/Postgres/Realtime）
  # URL 与 anon key 通过 --dart-define 构建注入，不进源码、不进 git
  supabase_flutter: ^2.0.0
  # 打开外部链接（首页官网入口跳转 roundplant.com）
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/roundplant_logo.png
    - assets/images/reward_qr.png
    - assets/changelog.json
  fonts:
    - family: ZCOOLKuaiLe
      fonts:
        - asset: assets/fonts/ZCOOLKuaiLe-Regular.ttf
  # v1 不需要外部图片资源 — 所有视觉用 Flutter Widget + Canvas 绘制
  # 用户添加的植物照片存储在 app 文件目录，不打包进 assets
