name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Flutter
        id: flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'

      - name: Create local.properties
        run: |
          echo "flutter.sdk=${{ env.FLUTTER_ROOT }}" > android/local.properties
          cat android/local.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        # 2>&1 把 stderr（真正报错）也捕获进 build.log，方便排查
        run: flutter build apk --release 2>&1 | tee build.log
        continue-on-error: true

      - name: Check build result
        run: |
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            echo "BUILD SUCCESS"
          else
            echo "BUILD FAILED - 下面是错误日志:"
            sed 's/\x1b\[[0-9;]*m//g' build.log 2>/dev/null | tail -n 500 || echo "no build.log"
            exit 1
          fi

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
